name: CI
on:
  push:
    branches: ["**"]
  pull_request:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  VITE_FIREBASE_API_KEY: demo-key
  VITE_FIREBASE_AUTH_DOMAIN: demo-manchester-piti.firebaseapp.com
  VITE_FIREBASE_PROJECT_ID: demo-manchester-piti
  VITE_FIREBASE_APP_ID: demo-app
jobs:
  verify:
    name: Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm ci --prefix functions
      - run: npm --prefix functions run build
      - run: pnpm lint --max-warnings 0
      - run: pnpm test
      - run: pnpm build
  e2e:
    name: Rules · Backend · Browser (demo emulators)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: npm ci --prefix functions
      - run: npm --prefix functions run build
      - name: Create emulator-only fixture secret
        run: echo "TEAM_PASSWORD=ci-team-only" > functions/.secret.local
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run isolated integration suite
        run: >-
          pnpm dlx firebase-tools@15.30.2 emulators:exec
          --only auth,firestore,functions
          --project demo-manchester-piti
          "npm --prefix functions test && pnpm exec vitest run --config vitest.rules.config.ts && pnpm test:e2e"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
