name: Setup
description: pnpm + Node 24 with the pnpm store cached, the app's dependencies and the built functions.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 10
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - run: npm ci --prefix functions
      shell: bash
    - run: npm --prefix functions run build
      shell: bash
